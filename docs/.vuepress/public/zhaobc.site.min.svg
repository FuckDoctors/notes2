<svg xmlns="http://www.w3.org/2000/svg" width="420" height="220" viewBox="0 0 420 120"><style>@keyframes blink-zhao{0%{text-decoration:none}15%,45%{transform:scale(1.3)}30%,60%{transform:scale(1)}to{text-decoration:none;text-transform:lowercase;transform:scale(.8) translate(55px,70px)}}@keyframes blink-b{0%{text-decoration:none}15%,45%{transform:scale(1.3)}30%,60%{transform:scale(1)}to{text-decoration:none;text-transform:lowercase;transform:scale(.8) translate(45px,70px)}}@keyframes blink-c{0%{text-decoration:none}15%,45%{transform:scale(1.3)}30%,60%{transform:scale(1)}to{text-decoration:none;transform:scale(.8) translate(15px,70px)}}@keyframes blink-site{0%{text-decoration:none}15%,45%{transform:scale(1.3)}30%,60%{transform:scale(1)}to{text-decoration:none;transform:scale(.8) translate(-55px,70px)}}@keyframes reset-pos{to{text-decoration:underline;transform:translate(0,0) scale(1)}}@keyframes reset-zhao{to{text-transform:capitalize}}@keyframes reset-b{to{text-transform:capitalize}}@keyframes domainFadeIn{to{opacity:1}}text{font-size:26px;fill:currentColor}</style><text x="70" y="40" style="font-weight:700;text-decoration:underline;transform-origin:center;animation:blink-zhao 1.5s linear forwards,reset-pos 0s step-end forwards,reset-zhao 0s forwards;animation-delay:0s,1.5s,1.5s">Zhao</text><text x="150" y="40" style="font-weight:700;text-decoration:underline;transform-origin:center;animation:blink-zhao 1.5s linear forwards,reset-pos 0s step-end forwards,reset-zhao 0s forwards;animation-delay:0s,1.5s,1.5s;animation-name:blink-b,reset-pos,reset-b">B</text><text x="170" y="40">in</text><text x="200" y="40" style="font-weight:700;text-decoration:underline;transform-origin:center;animation:blink-zhao 1.5s linear forwards,reset-pos 0s step-end forwards,reset-zhao 0s forwards;animation-delay:0s,1.5s,1.5s;animation-name:blink-c,reset-pos,kf-noop">c</text><text x="215" y="40">hen&apos;s </text><text x="290" y="40" style="font-weight:700;text-decoration:underline;transform-origin:center;animation:blink-zhao 1.5s linear forwards,reset-pos 0s step-end forwards,reset-zhao 0s forwards;animation-delay:0s,1.5s,1.5s;animation-name:blink-site,reset-pos,kf-noop">site</text><text x="210" y="100" style="animation:domainFadeIn .6s linear forwards;animation-delay:1.5s;opacity:0;text-anchor:middle">zhaobc.site</text></svg>